name: Static Analysis

on:
  push:
    branches:
      - main
    paths-ignore:
      # Root files only: docs/ and resources/markdown/ are served by the app and covered by tests.
      - '*.md'
      - 'LICENSE'
      - '.ai/**'
      - '.github/*.md'
      - '.github/workflows/cla.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/security-audit.yml'
      - '.github/workflows/update-changelog.yml'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.ai/**'
      - '.github/*.md'
      - '.github/workflows/cla.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/security-audit.yml'
      - '.github/workflows/update-changelog.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Run Pint
        run: vendor/bin/pint --test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      # Larastan boots the application
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Cache phpstan results
        uses: actions/cache@v6
        with:
          path: /tmp/phpstan
          key: phpstan-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ github.ref }}-
            phpstan-refs/heads/main-

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --error-format=github

  rector:
    name: Rector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Cache rector results
        uses: actions/cache@v6
        with:
          path: /tmp/rector
          key: rector-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            rector-${{ github.ref }}-
            rector-refs/heads/main-

      - name: Run Rector
        run: vendor/bin/rector --dry-run --output-format=github
