name: Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      # Root files only: docs/ and resources/markdown/ are served by the app and covered by tests.
      - '*.md'
      - 'LICENSE'
      - '.ai/**'
      - '.github/*.md'
      - '.github/workflows/cla.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/security-audit.yml'
      - '.github/workflows/update-changelog.yml'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.ai/**'
      - '.github/*.md'
      - '.github/workflows/cla.yml'
      - '.github/workflows/docker.yml'
      - '.github/workflows/security-audit.yml'
      - '.github/workflows/update-changelog.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: root
          POSTGRES_DB: simplestats_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, gd, intl, pdo_pgsql, pgsql, zip
          coverage: none

      # CI runs the self-hosted build (composer.json); saas-only tests skip themselves
      - name: Install composer dependencies
        uses: ramsey/composer-install@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: composer test
